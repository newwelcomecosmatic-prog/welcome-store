<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome Cosmetic Store</title>
<meta name="theme-color" content="#e8bcf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Welcome Cosmetic">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="html5-qrcode.min.js"></script>
<style>
:root{--p:#e8bcf0;--pd:#6b2d7b;--pt:#3d1347;--pl:#fbf1fd;--pm:#d9a9e4;--line:#ecd4f1;--paper:#fdf8fe;--ink:#231326;--mut:#7a6580;--red:#b3261e;--green:#1f7a4d;--amber:#a86a00;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;padding-bottom:calc(132px + var(--sb))}
header{background:var(--p);color:var(--pt);padding:calc(12px + var(--st)) 14px 12px;font-weight:800;font-size:18px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--pm);display:flex;align-items:center;gap:8px}
header .ttl{flex:1}
header button{background:rgba(255,255,255,.55);color:var(--pt);border:1px solid var(--pm);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
main{padding:12px;max-width:640px;margin:0 auto}
button{font:inherit;cursor:pointer}
.btn{background:var(--pd);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:600}
.btn.alt{background:#fff;color:var(--pd);border:1px solid var(--pd)}
.btn.soft{background:var(--p);color:var(--pt)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--pm);background:var(--pl);color:var(--pt);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
input[type=text],input[type=password],input[type=url],input[type=number],input[type=search],input[type=date]{width:100%;padding:11px;border:1px solid var(--pm);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}
input:focus{outline:2px solid var(--p);border-color:var(--pd)}
#reader,#reader2{width:100%;margin:8px 0;border-radius:10px;overflow:hidden}
.sugg{background:#fff;border:1px solid var(--pm);border-radius:10px;margin-top:4px}
.sugg div{padding:10px;border-bottom:1px solid var(--line)}
.sugg div:last-child{border-bottom:0}
.sugg small{display:block;color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.card h4{margin:0 0 6px;color:var(--pd);font-size:16px}
.card p{margin:0 0 8px;color:var(--mut);font-size:13px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.itop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.iname{font-weight:700}
.iname small{display:block;color:var(--mut);font-weight:400}
.ctrl{display:flex;align-items:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
.pin{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mut)}
.price{width:92px!important;padding:8px!important}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border:1px solid var(--pd);background:#fff;border-radius:10px;font-size:18px;color:var(--pd)}
.qty input{width:52px!important;text-align:center;padding:8px!important}
.line{margin-left:auto;font-weight:800;color:var(--pd)}
.x{border:0;background:none;color:var(--red);font-size:24px;line-height:1;padding:0 4px}
.empty{color:var(--mut);text-align:center;padding:22px 8px}
.savebar{position:fixed;left:0;right:0;bottom:calc(56px + var(--sb));background:#fff;border-top:1px solid var(--pm);padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:6}
.savebar .tot{flex:1;font-weight:800;font-size:16px;color:var(--pd)}
.savebar .btn{flex:0 0 44%}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(56px + var(--sb));padding-bottom:var(--sb);display:flex;background:var(--p);border-top:1px solid var(--pm);z-index:7}
nav button{flex:1;background:none;border:0;color:#8a5c99;font-weight:700;font-size:14px}
nav button.on{color:var(--pt);box-shadow:inset 0 3px 0 var(--pd);background:var(--pl)}
.plist .p{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px}
.plist small{color:var(--mut);display:block}
.stk{font-weight:800;white-space:nowrap;align-self:center;font-size:17px}
.low{color:var(--amber)}.zero{color:var(--red)}.okk{color:var(--green)}
.info{color:var(--mut);font-size:13px;margin:8px 2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--pl);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat small{display:block;color:var(--mut)}
.stat b{font-size:18px;color:var(--pt)}
.stat.big{background:var(--p);border-color:var(--pm)}
.neg{color:var(--red)!important}
#toast{position:fixed;top:calc(64px + var(--st));left:12px;right:12px;padding:12px;border-radius:10px;color:#fff;z-index:40;display:none;text-align:center}
#toast.err{background:var(--red)}#toast.ok{background:var(--green)}
.ov{position:fixed;inset:0;background:rgba(35,19,38,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
.box h3{margin:0 0 10px;color:var(--pd)}
.box label{display:block;margin:10px 0 4px;font-weight:600}
.box a.btn{display:block;text-align:center;text-decoration:none;margin-top:8px}
.hint{font-size:13px;color:var(--mut);margin-top:6px;min-height:18px}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="ttl">Welcome Cosmetic Store</div>
  <button id="instBtn" class="hide" onclick="installApp()">Install</button>
  <button onclick="openSettings()" aria-label="Settings">&#9881; Settings</button>
</header>
<div id="toast"></div>

<main>
  <!-- SALE / STOCK IN -->
  <section id="vScan">
    <div class="row">
      <button class="btn" id="scanBtn" onclick="toggleScan()">Camera se scan karein</button>
      <button class="btn alt hide" id="newBtn" onclick="openNew('', false)">+ Naya product</button>
    </div>
    <div id="reader"></div>
    <input type="search" id="manual" placeholder="Barcode likhein ya product ka naam" autocomplete="off"
           oninput="suggest()" onkeydown="if(event.key==='Enter'){manualAdd()}" style="margin-top:6px">
    <div id="sugg" class="sugg hide"></div>
    <div id="custWrap" style="margin-top:8px"><input type="text" id="cust" placeholder="Customer ka naam (optional)"></div>
    <div id="cart"></div>
  </section>

  <!-- PRODUCTS -->
  <section id="vProd" class="hide">
    <div class="row">
      <button class="btn" onclick="openNew('', false)">+ Naya product</button>
      <button class="btn alt" onclick="loadProducts(true)">Refresh</button>
    </div>
    <input type="search" id="psearch" placeholder="Product dhoondein (naam / barcode)" oninput="renderProducts()" style="margin-top:8px">
    <div class="info" id="pinfo"></div>
    <div id="plist" class="plist"></div>
  </section>

  <!-- REPORTS -->
  <section id="vRep" class="hide">
    <div class="card">
      <h4>Stock Report</h4>
      <p>Har product ka available stock (A4 PDF).</p>
      <button class="btn" id="repBtn" onclick="stockReport()" style="width:100%">Stock Report PDF</button>
    </div>

    <div class="card">
      <h4>Sale Report (profit ke sath)</h4>
      <p>Date chunein, phir summary dekhein ya PDF banayein.</p>
      <div class="chips">
        <button class="chip" onclick="quick('today')">Aaj</button>
        <button class="chip" onclick="quick('yest')">Kal</button>
        <button class="chip" onclick="quick('week')">Pichle 7 din</button>
        <button class="chip" onclick="quick('month')">Is mahine</button>
      </div>
      <div class="row">
        <div><label style="font-size:12px;color:var(--mut)">From</label><input type="date" id="rFrom"></div>
        <div><label style="font-size:12px;color:var(--mut)">To</label><input type="date" id="rTo"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn alt" id="sumBtn" onclick="salesReport(false)">Summary dekhein</button>
        <button class="btn" id="spdfBtn" onclick="salesReport(true)">Sale Report PDF</button>
      </div>
      <div id="sumBox" class="grid hide"></div>
    </div>
  </section>
</main>

<div class="savebar" id="savebar">
  <div class="tot" id="tot"></div>
  <button class="btn" id="saveBtn" onclick="save()">Save</button>
</div>

<nav>
  <button id="tSALE" class="on" onclick="setTab('SALE')">Sale</button>
  <button id="tIN" onclick="setTab('IN')">Stock In</button>
  <button id="tPROD" onclick="setTab('PROD')">Products</button>
  <button id="tREP" onclick="setTab('REP')">Reports</button>
</nav>

<!-- Settings -->
<div class="ov" id="ovSet">
  <div class="box">
    <h3>Settings</h3>
    <label>Server link (Apps Script Web App URL)</label>
    <input type="url" id="sUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Password</label>
    <input type="password" id="sKey" placeholder="Code.gs wala API_KEY">
    <div class="hint">iPhone: Safari mein Share &rarr; "Add to Home Screen". Android: Chrome menu &rarr; "Install app".</div>
    <div class="row" style="margin-top:14px">
      <button class="btn alt" id="sCancel" onclick="closeSettings()">Band</button>
      <button class="btn" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<!-- Naya product dialog -->
<div class="ov" id="ovNew">
  <div class="box">
    <h3>Naya product</h3>
    <label>Barcode</label>
    <div class="row">
      <input type="text" id="nCode" placeholder="Scan karein ya khud likhein" style="flex:2">
      <button class="btn soft" id="dScanBtn" onclick="toggleDlgScan()" style="flex:1">Scan</button>
    </div>
    <div id="reader2" class="hide"></div>
    <label>Product ka naam</label><input type="text" id="nName">
    <div class="row">
      <div><label>Purchase price</label><input type="number" inputmode="decimal" id="nBuy" oninput="profitHint()"></div>
      <div><label>Sale price</label><input type="number" inputmode="decimal" id="nSale" oninput="profitHint()"></div>
    </div>
    <div class="hint" id="nHint"></div>
    <div id="nStockWrap"><label>Opening stock (optional)</label><input type="number" inputmode="numeric" id="nStock" placeholder="0"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn alt" onclick="closeNew()">Cancel</button>
      <button class="btn" id="nSave" onclick="saveNew()">Save product</button>
    </div>
  </div>
</div>

<!-- Save / report done dialog -->
<div class="ov" id="ovDone">
  <div class="box">
    <h3 id="dTitle"></h3>
    <p id="dMsg" style="margin:0"></p>
    <div id="dLinks"></div>
    <button class="btn alt" style="width:100%;margin-top:8px" onclick="$('ovDone').style.display='none'">Theek hai</button>
  </div>
</div>

<script>
var products = [], pmap = {}, carts = {SALE: [], IN: []}, mode = 'SALE';
var mainScn = null, mainOn = false, mainBusy = false;
var dlgScn = null, dlgOn = false, dlgBusy = false;
var last = {code: '', t: 0}, saving = false, pendingAdd = false, actx = null, deferredPrompt = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return Number(n).toLocaleString('en-US', {maximumFractionDigits: 2}); }

function toast(msg, type){
  var t = $('toast'); t.textContent = msg; t.className = type || 'ok'; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(function(){ t.style.display = 'none'; }, 3000);
}
function fail(e){ beep('err'); toast((e && e.message) ? e.message : String(e), 'err'); }

/* ---------- settings + storage ---------- */
var mem = {};
function store(k, v){
  try{ if (v === undefined) return localStorage.getItem('wcs_' + k) || mem[k] || ''; localStorage.setItem('wcs_' + k, v); }
  catch(e){ if (v === undefined) return mem[k] || ''; mem[k] = v; }
}
function hasConfig(){ return !!(store('url') && store('key')); }
function openSettings(){
  $('sUrl').value = store('url'); $('sKey').value = store('key');
  $('sCancel').classList.toggle('hide', !hasConfig());
  $('ovSet').style.display = 'flex';
}
function closeSettings(){ $('ovSet').style.display = 'none'; }
function saveSettings(){
  var u = $('sUrl').value.trim(), k = $('sKey').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){ fail('Link "https://script.google.com/.../exec" jaisa hona chahiye'); return; }
  if (!k){ fail('Password likhein'); return; }
  store('url', u); store('key', k);
  closeSettings(); loadProducts(true);
}

/* ---------- API (Google Apps Script JSON) ---------- */
function api(action, payload){
  return fetch(store('url'), {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({key: store('key'), action: action, payload: payload || {}})
  }).then(function(r){
    return r.json().catch(function(){
      throw new Error('Server ka jawab ghalat hai. Deployment "Who has access: Anyone" honi chahiye.');
    });
  }, function(){
    var e = new Error('Server se rabta nahi hua. Internet ya server link check karein.'); e.net = true; throw e;
  }).then(function(j){
    if (!j.ok){ var er = new Error(j.error || 'Error'); if (/Password/.test(er.message)) er.auth = true; throw er; }
    return j.data;
  });
}

/* ---------- sounds ---------- */
function unlockAudio(){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }catch(e){}
}
['click', 'touchstart', 'keydown'].forEach(function(ev){ document.addEventListener(ev, unlockAudio, {passive: true}); });
function tone(freq, dur, type, delay, vol){
  try{
    unlockAudio(); if (!actx) return;
    var t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
function beep(kind){
  if (kind === 'scan'){ tone(1500, 0.12, 'square', 0, 0.2); if (navigator.vibrate) navigator.vibrate(30); }
  else if (kind === 'add'){ tone(880, 0.09, 'sine', 0, 0.3); tone(1320, 0.14, 'sine', 0.1, 0.3); }
  else if (kind === 'err'){ tone(200, 0.3, 'sawtooth', 0, 0.25); if (navigator.vibrate) navigator.vibrate([60, 40, 60]); }
}

/* ---------- install ---------- */
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt = e; $('instBtn').classList.remove('hide'); });
window.addEventListener('appinstalled', function(){ deferredPrompt = null; $('instBtn').classList.add('hide'); toast('App install ho gayi'); });
function installApp(){
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){ deferredPrompt = null; $('instBtn').classList.add('hide'); });
}
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* ---------- data ---------- */
function loadProducts(showOk){
  if (!hasConfig()){ openSettings(); return; }
  api('getProducts').then(function(list){
    store('cache', JSON.stringify(list)); setProducts(list);
    if (showOk === true) toast('Products update ho gaye');
  }).catch(function(e){
    if (e.auth){ fail(e); openSettings(); return; }
    var c = null; try{ c = JSON.parse(store('cache') || 'null'); }catch(x){}
    if (c){ setProducts(c); toast('Offline: purani product list dikh rahi hai', 'err'); } else fail(e);
  });
}
function setProducts(list){
  products = list || []; pmap = {};
  products.forEach(function(p){ pmap[p.barcode] = p; });
  renderProducts(); renderCart();
}

/* ---------- tabs ---------- */
function setTab(t){
  if (mainOn) stopMain();
  ['SALE', 'IN', 'PROD', 'REP'].forEach(function(x){ $('t' + x).className = (x === t) ? 'on' : ''; });
  var scanView = (t === 'SALE' || t === 'IN');
  $('vScan').classList.toggle('hide', !scanView);
  $('vProd').classList.toggle('hide', t !== 'PROD');
  $('vRep').classList.toggle('hide', t !== 'REP');
  $('savebar').classList.toggle('hide', !scanView);
  if (scanView){
    mode = t;
    $('custWrap').classList.toggle('hide', t !== 'SALE');
    $('newBtn').classList.toggle('hide', t !== 'IN');
    renderCart();
  }
  $('sugg').className = 'sugg hide';
}

/* ---------- scanner (main) ---------- */
function mkScanner(elId, cb){
  var F = Html5QrcodeSupportedFormats;
  var s = new Html5Qrcode(elId, {
    formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE],
    useBarCodeDetectorIfSupported: true, verbose: false
  });
  return s.start({facingMode: 'environment'},
    {fps: 10, qrbox: function(w){ return {width: Math.floor(w * 0.85), height: 130}; }},
    cb, function(){}).then(function(){ return s; });
}
function toggleScan(){ if (mainOn) stopMain(); else startMain(); }
function startMain(){
  unlockAudio();
  if (mainBusy) return;
  if (!window.Html5Qrcode){ fail('Scanner load nahi hua. Page dobara kholein.'); return; }
  if (dlgOn) stopDlg();
  mainBusy = true;
  mkScanner('reader', onScan).then(function(s){
    mainScn = s; mainOn = true; mainBusy = false; $('scanBtn').textContent = 'Camera band karein';
  }).catch(function(){
    mainBusy = false; fail('Camera nahi khula. Permission allow karein ya barcode khud likhein.');
  });
}
function stopMain(){
  if (!mainScn) return;
  var s = mainScn; mainScn = null; mainOn = false;
  $('scanBtn').textContent = 'Camera se scan karein';
  s.stop().then(function(){ s.clear(); }).catch(function(){});
}
function onScan(text){
  var now = Date.now();
  if (text === last.code && now - last.t < 2000){ last.t = now; return; }
  last = {code: text, t: now};
  beep('scan');
  setTimeout(function(){ handleCode(text); }, 170);
}
function handleCode(code){
  code = String(code).trim(); if (!code) return;
  var p = pmap[code];
  if (p){ addToCart(p); return; }
  if (mode === 'IN'){ openNew(code, true); return; }
  beep('err'); toast('Product nahi mila: ' + code, 'err');
}

/* ---------- search / manual ---------- */
function matches(q){
  q = q.toLowerCase();
  return products.filter(function(p){ return p.barcode.toLowerCase().indexOf(q) > -1 || p.name.toLowerCase().indexOf(q) > -1; });
}
function suggest(){
  var q = $('manual').value.trim(), s = $('sugg');
  if (!q){ s.className = 'sugg hide'; return; }
  var m = matches(q).slice(0, 6);
  s.className = 'sugg';
  if (!m.length){ s.innerHTML = '<div>Koi product nahi mila</div>'; return; }
  s.innerHTML = m.map(function(p){
    return '<div data-c="' + esc(p.barcode) + '" onclick="pick(this.dataset.c)">' + esc(p.name) +
      '<small>' + esc(p.barcode) + ' | Stock ' + p.stock + ' | Rs. ' + money(p.sale) + '</small></div>';
  }).join('');
}
function pick(code){ $('manual').value = ''; $('sugg').className = 'sugg hide'; handleCode(code); }
function manualAdd(){
  var q = $('manual').value.trim(); if (!q) return;
  if (pmap[q]){ pick(q); return; }
  var m = matches(q);
  if (m.length){ pick(m[0].barcode); return; }
  $('manual').value = ''; $('sugg').className = 'sugg hide'; handleCode(q);
}

/* ---------- cart ---------- */
function unitPrice(p){ return mode === 'SALE' ? p.sale : p.purchase; }
function addToCart(p){
  var c = carts[mode], it = null;
  c.forEach(function(x){ if (x.barcode === p.barcode) it = x; });
  var next = (it ? it.qty : 0) + 1;
  if (mode === 'SALE' && next > p.stock){ beep('err'); toast(p.name + ': stock khatam / kam (' + p.stock + ')', 'err'); return; }
  if (it) it.qty = next; else c.push({barcode: p.barcode, name: p.name, price: unitPrice(p), qty: 1});
  beep('add'); renderCart();
}
function chg(i, d){
  var it = carts[mode][i], p = pmap[it.barcode], q = it.qty + d;
  if (q < 1) return;
  if (mode === 'SALE' && p && q > p.stock){ beep('err'); toast('Stock kam hai (' + p.stock + ')', 'err'); return; }
  it.qty = q; if (d > 0) beep('add'); renderCart();
}
function setQty(i, v){
  var it = carts[mode][i], p = pmap[it.barcode], q = Math.floor(Number(v));
  if (!(q > 0)) q = 1;
  if (mode === 'SALE' && p && q > p.stock){ beep('err'); toast('Stock kam hai (' + p.stock + ')', 'err'); q = Math.max(1, p.stock); }
  it.qty = q; renderCart();
}
function setPrice(i, v){ var n = Number(v); if (n >= 0) carts[mode][i].price = n; renderCart(); }
function del(i){ carts[mode].splice(i, 1); renderCart(); }
function renderCart(){
  var c = carts[mode], h = '', total = 0, units = 0;
  c.forEach(function(it, i){
    total += it.price * it.qty; units += it.qty;
    var p = pmap[it.barcode] || {stock: 0};
    h += '<div class="item"><div class="itop"><div class="iname">' + esc(it.name) + '<small>Stock: ' + p.stock + '</small></div>' +
      '<button class="x" onclick="del(' + i + ')">&times;</button></div>' +
      '<div class="ctrl"><div class="qty"><button onclick="chg(' + i + ',-1)">&minus;</button>' +
      '<input type="number" inputmode="numeric" value="' + it.qty + '" onchange="setQty(' + i + ',this.value)">' +
      '<button onclick="chg(' + i + ',1)">+</button></div>' +
      '<label class="pin">' + (mode === 'SALE' ? 'Sale price' : 'Purchase price') +
      '<input class="price" type="number" inputmode="decimal" value="' + it.price + '" onchange="setPrice(' + i + ',this.value)"></label>' +
      '<div class="line">Rs. ' + money(it.price * it.qty) + '</div></div></div>';
  });
  $('cart').innerHTML = h || '<p class="empty">Barcode scan karein ya naam likh kar product chunein.</p>';
  $('tot').textContent = mode === 'SALE' ? 'Total: Rs. ' + money(total) : units + ' units | Rs. ' + money(total);
  $('saveBtn').textContent = mode === 'SALE' ? 'Save Bill' : 'Save Stock In';
}

function save(){
  if (saving) return;
  var c = carts[mode];
  if (!c.length){ beep('err'); toast('Cart khali hai', 'err'); return; }
  saving = true; $('saveBtn').disabled = true; $('saveBtn').textContent = 'Save ho raha hai...';
  var wasSale = mode === 'SALE', key = wasSale ? 'SALE' : 'IN';
  api('saveTransaction', {type: key, customer: $('cust').value, items: c})
    .then(function(r){
      saving = false; $('saveBtn').disabled = false;
      carts[key] = []; $('cust').value = '';
      loadProducts(); renderCart();
      beep('add');
      var l = '';
      if (r.pdf){
        l = '<a class="btn" href="' + r.pdf.url + '" target="_blank" rel="noopener">PDF kholain</a>' +
            '<a class="btn alt" href="' + r.pdf.downloadUrl + '" target="_blank" rel="noopener">PDF download</a>';
      }
      showDone(wasSale ? 'Bill save ho gaya' : 'Stock In save ho gaya',
        r.billNo + (r.pdf ? '' : ' | Stock update ho gaya lekin PDF nahi bani: ' + (r.pdfError || '')), l);
    })
    .catch(function(e){ saving = false; $('saveBtn').disabled = false; renderCart(); fail(e); if (e.auth) openSettings(); });
}
function showDone(title, msg, links){
  $('dTitle').textContent = title; $('dMsg').textContent = msg; $('dLinks').innerHTML = links || '';
  $('ovDone').style.display = 'flex';
}

/* ---------- products tab ---------- */
function renderProducts(){
  var q = ($('psearch').value || '').trim(), list = q ? matches(q) : products, units = 0;
  products.forEach(function(p){ units += p.stock; });
  $('pinfo').textContent = products.length + ' products | ' + units + ' units stock mein';
  $('plist').innerHTML = list.slice(0, 300).map(function(p){
    var cls = p.stock <= 0 ? 'zero' : (p.stock <= 3 ? 'low' : 'okk');
    return '<div class="p"><div>' + esc(p.name) + '<small>' + esc(p.barcode) + '</small><small>Purchase Rs. ' + money(p.purchase) +
      ' | Sale Rs. ' + money(p.sale) + '</small></div><div class="stk ' + cls + '">' + p.stock + '</div></div>';
  }).join('') || '<p class="empty">Koi product nahi.</p>';
}

/* ---------- new product (scan ya manual) ---------- */
function openNew(code, addAfter){
  pendingAdd = !!addAfter;
  if (mainOn) stopMain();
  $('nCode').value = code || ''; $('nName').value = ''; $('nBuy').value = ''; $('nSale').value = ''; $('nStock').value = '';
  $('nStockWrap').classList.toggle('hide', pendingAdd);
  $('nHint').textContent = '';
  $('ovNew').style.display = 'flex';
}
function closeNew(){ if (dlgOn) stopDlg(); $('ovNew').style.display = 'none'; }
function profitHint(){
  var b = Number($('nBuy').value), s = Number($('nSale').value), h = $('nHint');
  if ($('nBuy').value === '' || $('nSale').value === ''){ h.textContent = ''; h.style.color = ''; return; }
  var d = s - b;
  h.textContent = 'Profit per piece: Rs. ' + money(d) + (b > 0 ? ' (' + Math.round(d / b * 100) + '%)' : '');
  h.style.color = d < 0 ? 'var(--red)' : 'var(--green)';
}
function toggleDlgScan(){ if (dlgOn) stopDlg(); else startDlg(); }
function startDlg(){
  unlockAudio();
  if (dlgBusy) return;
  if (!window.Html5Qrcode){ fail('Scanner load nahi hua. Page dobara kholein.'); return; }
  if (mainOn) stopMain();
  dlgBusy = true; $('reader2').classList.remove('hide');
  mkScanner('reader2', onDlgScan).then(function(s){
    dlgScn = s; dlgOn = true; dlgBusy = false; $('dScanBtn').textContent = 'Band';
  }).catch(function(){
    dlgBusy = false; $('reader2').classList.add('hide'); fail('Camera nahi khula. Barcode khud likh dein.');
  });
}
function stopDlg(){
  if (!dlgScn) return;
  var s = dlgScn; dlgScn = null; dlgOn = false;
  $('dScanBtn').textContent = 'Scan'; $('reader2').classList.add('hide');
  s.stop().then(function(){ s.clear(); }).catch(function(){});
}
function onDlgScan(text){
  beep('scan');
  var c = String(text).trim();
  stopDlg();
  if (pmap[c]){ toast('Yeh barcode pehle se hai: ' + pmap[c].name, 'err'); return; }
  $('nCode').value = c;
}
function saveNew(){
  var d = {
    barcode: $('nCode').value.trim(), name: $('nName').value.trim(),
    purchase: $('nBuy').value, sale: $('nSale').value, stock: pendingAdd ? 0 : $('nStock').value
  };
  if (!d.barcode || !d.name){ beep('err'); toast('Barcode aur naam likhein', 'err'); return; }
  if (d.purchase === '' || d.sale === ''){ beep('err'); toast('Purchase aur sale price dono likhein', 'err'); return; }
  var b = $('nSave'); b.disabled = true;
  api('addProduct', d)
    .then(function(p){
      b.disabled = false; closeNew();
      products.push(p); pmap[p.barcode] = p; renderProducts();
      beep('add'); toast('Product add ho gaya');
      if (pendingAdd && mode === 'IN') addToCart(p);
    })
    .catch(function(e){ b.disabled = false; fail(e); });
}

/* ---------- reports ---------- */
function stockReport(){
  var b = $('repBtn'); b.disabled = true; b.textContent = 'Report ban rahi hai...';
  api('getStockReport')
    .then(function(f){
      b.disabled = false; b.textContent = 'Stock Report PDF'; beep('add');
      showDone('Stock report tayyar', f.name,
        '<a class="btn" href="' + f.url + '" target="_blank" rel="noopener">PDF kholain</a><a class="btn alt" href="' + f.downloadUrl + '" target="_blank" rel="noopener">PDF download</a>');
    })
    .catch(function(e){ b.disabled = false; b.textContent = 'Stock Report PDF'; fail(e); });
}
function pad(n){ return (n < 10 ? '0' : '') + n; }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function quick(k){
  var t = new Date(), f = new Date(), e = new Date();
  if (k === 'yest'){ f.setDate(f.getDate() - 1); e = new Date(f); }
  else if (k === 'week'){ f.setDate(f.getDate() - 6); }
  else if (k === 'month'){ f = new Date(t.getFullYear(), t.getMonth(), 1); }
  $('rFrom').value = ymd(f); $('rTo').value = ymd(e);
}
function salesReport(pdf){
  var from = $('rFrom').value, to = $('rTo').value;
  if (!from || !to){ beep('err'); toast('From aur To date chunein', 'err'); return; }
  var b = pdf ? $('spdfBtn') : $('sumBtn'), old = b.textContent;
  $('sumBtn').disabled = true; $('spdfBtn').disabled = true; b.textContent = 'Ruk jayein...';
  function done(){ $('sumBtn').disabled = false; $('spdfBtn').disabled = false; b.textContent = old; }
  api('getSalesReport', {from: from, to: to, makePdf: !!pdf})
    .then(function(r){
      done(); showSummary(r.summary); beep('add');
      if (pdf && r.pdf){
        showDone('Sale report tayyar', r.pdf.name,
          '<a class="btn" href="' + r.pdf.url + '" target="_blank" rel="noopener">PDF kholain</a><a class="btn alt" href="' + r.pdf.downloadUrl + '" target="_blank" rel="noopener">PDF download</a>');
      }
    })
    .catch(function(e){ done(); fail(e); });
}
function showSummary(s){
  var box = $('sumBox');
  box.classList.remove('hide');
  box.innerHTML =
    '<div class="stat"><small>Total Sale</small><b>Rs. ' + money(s.sales) + '</b></div>' +
    '<div class="stat"><small>Total Cost</small><b>Rs. ' + money(s.cost) + '</b></div>' +
    '<div class="stat big"><small>Profit</small><b class="' + (s.profit < 0 ? 'neg' : '') + '">Rs. ' + money(s.profit) + '</b></div>' +
    '<div class="stat"><small>Bills | Units</small><b>' + s.bills + ' | ' + s.units + '</b></div>';
}

/* ---------- start ---------- */
quick('today');
renderCart();
if (hasConfig()) loadProducts(); else openSettings();
</script>
</body>
</html>
